name: NexusFix Pro APK CI Compiler

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code Blueprint
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17 (Android Compliance)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Fix Broken Linux Packages & Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libunwind-dev git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev wget m4
        sudo apt-get install -y gstreamer1.0-plugins-base libgstreamer-plugins-base1.0-dev
        pip install --upgrade pip
        pip install buildozer cython virtualenv kivy

    - name: Pre-Build Target Path & Fix Sdkmanager Layout
      run: |
        # Buildozer ke auto-download paths ko pehle se force-create kar rahe hain
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/cmdline-tools
        
        # Latest standard commandline tools ko direct download karna
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline.zip
        unzip -q cmdline.zip -d $HOME/.buildozer/android/platform/android-sdk/cmdline-tools
        mv $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/cmdline-tools $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest
        rm cmdline.zip

        # TRICK: Buildozer jo purana directory structure dhoodh raha hai use system level par create karna
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/tools/bin
        
        # Naye sdkmanager ka shortcut (Symlink) purane structure ke andar generate karna
        ln -sf $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        
        # Hardcoding signed system validation hashes directly inside target layout
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
        HASHES="\n2474c18b25f8bc4d5bc0996df89953fa98d34c1a\n2891785227d43fa4d2574d44e5019a14372a95c7\n85165d130ce6d747d50a368b5477815ded4de381\n45f18502b3a3047fb8231af4b3d814bc50db2d7a"
        echo -e "$HASHES" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

        # Running execution engine validation check inside the system to auto-approve paths
        yes | $HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --sdk_root=$HOME/.buildozer/android/platform/android-sdk --licenses

    - name: Generate Buildozer Target Pipeline
      run: |
        export BUILDOZER_ALLOW_ORG_INDEX_LOOKUP=1
        
        # Bypassing python-for-android auto downloads by linking our verified setup
        export ANDROIDSDK=$HOME/.buildozer/android/platform/android-sdk
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        
        # Final isolated compilation build
        buildozer --verbose android debug

    - name: Upload Final Bootable APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NexusFix-Pro-Debug-APK
        path: bin/*.apk
