name: NexusFix Pro APK CI Compiler

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code Blueprint
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17 (Android Compliance)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Fix Broken Linux Packages & Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libunwind-dev git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libgstreamer1.0-dev wget m4
        pip install --upgrade pip
        pip install buildozer cython virtualenv kivy

    - name: Download & Force-Sign Custom Android SDK
      run: |
        # Standalone commandline tools setup
        wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline.zip
        mkdir -p $HOME/android-sdk/cmdline-tools
        unzip cmdline.zip -d $HOME/android-sdk/cmdline-tools
        mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest
        
        # Injected approved system hashes to lock down licenses completely
        mkdir -p $HOME/android-sdk/licenses
        echo -e "\n2474c18b25f8bc4d5bc0996df89953fa98d34c1a\n2891785227d43fa4d2574d44e5019a14372a95c7\n85165d130ce6d747d50a368b5477815ded4de381" > $HOME/android-sdk/licenses/android-sdk-license
        
        # Setting running path scopes
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH

    - name: Generate Buildozer Target Pipeline
      run: |
        export BUILDOZER_ALLOW_ORG_INDEX_LOOKUP=1
        export ANDROIDSDK=$HOME/android-sdk
        
        # Run compiler with forced system configurations
        buildozer --verbose android debug

    - name: Upload Final Bootable APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NexusFix-Pro-Debug-APK
        path: bin/*.apk
