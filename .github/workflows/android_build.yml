name: NexusFix Pro APK CI Compiler

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code Blueprint
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17 (Android Compliance)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Fix Broken Linux Packages & Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libunwind-dev git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev wget m4
        sudo apt-get install -y gstreamer1.0-plugins-base libgstreamer-plugins-base1.0-dev
        pip install --upgrade pip
        pip install buildozer cython virtualenv kivy

    - name: Force Inject Machine-Level Global Licenses
      run: |
        # Purane saare structures ko clear karke main cache maps inject kar rahe hain
        rm -rf $HOME/.buildozer
        
        # System automatic accept layer inside ubuntu engine env
        mkdir -p $HOME/android-sdk/licenses
        mkdir -p $HOME/.android
        touch $HOME/.android/repositories.cfg
        
        # Android hardware platform target token hashes
        HASHES="\n2474c18b25f8bc4d5bc0996df89953fa98d34c1a\n2891785227d43fa4d2574d44e5019a14372a95c7\n85165d130ce6d747d50a368b5477815ded4de381\n45f18502b3a3047fb8231af4b3d814bc50db2d7a"
        echo -e "$HASHES" > $HOME/android-sdk/licenses/android-sdk-license
        
        # Copied same global keys for buildozer auto-generated internal structures
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
        echo -e "$HASHES" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license

    - name: Generate Buildozer Target Pipeline
      run: |
        export BUILDOZER_ALLOW_ORG_INDEX_LOOKUP=1
        
        # Declaring strict global auto-accept parameters directly inside Python engine
        export ANDROID_HOME=$HOME/android-sdk
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        
        # Strict continuous parameter script simulation without standard input breakups
        buildozer --verbose android debug

    - name: Upload Final Bootable APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NexusFix-Pro-Debug-APK
        path: bin/*.apk
