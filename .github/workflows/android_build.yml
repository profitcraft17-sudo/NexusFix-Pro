name: NexusFix Pro APK CI Compiler

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code Blueprint
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17 (Android Compliance)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Fix Broken Linux Packages & Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libunwind-dev
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake libffi-dev libgstreamer1.0-dev
        pip install --upgrade pip
        pip install buildozer cython virtualenv kivy

    - name: Generate Buildozer Target Pipeline
      run: |
        # FIXED: Automatically pipeline 'yes' to all Android SDK license prompts to prevent stalling
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes | buildozer android debug
        
    - name: Upload Final Bootable APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: NexusFix-Pro-Debug-APK
        path: bin/*.apk
